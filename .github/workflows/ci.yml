name: TechStore CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ============================================================
  # Lint, Typecheck & Build: Shared Package
  # ============================================================
  shared:
    name: Shared Package - Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build:shared

      - name: Upload shared dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: shared-dist
          path: packages/shared/dist/

  # ============================================================
  # Backend API: Typecheck & Build
  # ============================================================
  api:
    name: Backend API - Build & Test
    needs: shared
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download shared dist
        uses: actions/download-artifact@v4
        with:
          name: shared-dist
          path: packages/shared/dist/

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run typechecking
        run: npm run typecheck --workspace=@techstore/api

      - name: Build API
        run: npm run build:api

  # ============================================================
  # Frontend Web: Typecheck & Build
  # ============================================================
  web:
    name: Frontend Web - Build
    needs: shared
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run typechecking
        run: npm run typecheck --workspace=@techstore/web

      - name: Build frontend
        run: npm run build --workspace=@techstore/web

      - name: Upload web dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist/

  # ============================================================
  # Docker Build & Push (on main branch only)
  # ============================================================
  docker:
    name: Docker Build & Push
    needs: [api, web]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push API Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.api
          push: true
          tags: ghcr.io/${{ github.repository }}/api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Web Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.web
          push: true
          tags: ghcr.io/${{ github.repository }}/web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
